<script src="../../.claude/skills/motionmaxxing/runtime/vendor/gsap.min.js"></script>
<script src="../../.claude/skills/motionmaxxing/runtime/motion.js"></script>
<script src="burger-kit.js"></script>
<script>
/* SEEK CONTRACT: everything visible is a pure function of t. */
const M = Motion.film({ fps: 30, duration: 12, width: 1080, height: 1920, clock: 'smooth' });
const E = Motion.ease;
const ACCENT_DARK = '#7d90ff', ACCENT = '#2b46ff';
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const seg = (f, a, b, e = 'softLand') => E[e](clamp01((f - a) / (b - a)));
const lerp = (a, b, x) => a + (b - a) * x;

/* Frame plan (see STORYBOARD.md) */
const CUT_CTA = 270;
const TYPE_AT = [80, 91, 102, 113, 124, 135];       // each function starts typing here
const LIFT_AT = TYPE_AT.map((f) => f + 8);           // its layer answers 2 f after the typing lands
const COLLAPSE = [166, 182];                          // layers fall back together and the burger recentres
const PHONE_IN = [182, 206];                          // dolly out: the coal ground turns out to be the site's own hero
const LIFT = [1.87, 1.44, 1.12, 0.84, 0.44, 0];      // per-layer rise when unstacked (bottom bun stays on the floor)
const BASE_Y = [0.85, 0.81, 0.725, 0.715, 0.28, 0];  // assembled heights, as in makeBurger()
const PUSH = 0.1;                                      // the phone and the 3D camera push in 10 % about the burger slot
const pushAt = (f) => 1 + PUSH * clamp01((f - PHONE_IN[1]) / (CUT_CTA - PHONE_IN[1]));
const SLOT = { x: 540, y: 952 };                       // burger slot of the BRASA 41 hero on the phone, in frame px

/* camera framings: target height, distance, elevation (degrees) */
function framing(f) {
  let ty = 1.25, d = lerp(9.4, 9.0, clamp01(f / 50)), e = 9;
  const b = seg(f, 84, 112, 'glide');                 // pull back to fit the unstacked burger
  ty = lerp(ty, 1.85, b); d = lerp(d, 12.0, b); e = lerp(e, 12, b);
  ty = lerp(ty, 0.8, seg(f, COLLAPSE[0], COLLAPSE[1], 'softInOut'));   // the reassembled burger moves to the frame centre (the slot)
  const c = seg(f, PHONE_IN[0], PHONE_IN[1], 'softInOut');
  d = lerp(d, 27.1, c); e = lerp(e, 16, c);
  d /= pushAt(f);                                     // the camera pushes in with the phone (size ~ 1/d)
  const r = (e * Math.PI) / 180;
  return { position: [0, ty + d * Math.sin(r), d * Math.cos(r)], target: [0, ty, 0], fov: 30 };
}

const hero = M.hero3d('#gl', {
  width: 1080, height: 1920,
  envMap: 'room', toneMapping: 'aces', exposure: 0.95, envIntensity: 0.42,
  key: { position: [3, 6, 4], intensity: 2.6, color: '#ffe2b8' },
  rim: { position: [-4, 2.5, -3.5], intensity: 3.2, color: '#ff5a1f' },
  ground: { y: -0.01, opacity: 0.4 },
  camera: { fov: 30, position: [0, 2.7, 9.3], target: [0, 1.25, 0] },
  build: (THREE, scene) => {
    scene.add(new THREE.HemisphereLight('#ffd9a8', '#2a160c', 0.45));
    const b = BurgerKit(THREE).makeBurger();
    const out = { burger: b.root };
    b.stack.forEach((s, i) => { out['l' + i] = s.obj; });
    return out;
  },
  state: (t, o, ctx) => {
    const f = ctx.f;
    if (f >= CUT_CTA) return { objects: { burger: { visible: false } } };
    const fall = 1 - seg(f, COLLAPSE[0], COLLAPSE[1], 'softInOut');
    const objects = {};
    LIFT.forEach((lift, i) => {
      const k = seg(f, LIFT_AT[i], LIFT_AT[i] + 16, 'softLand') * fall;
      objects['l' + i] = { position: [0, BASE_Y[i] + lift * k, 0] };
    });
    // a held "photo" angle, then a full whip turn with a tilt, then the slow turn the live site has
    let ry = 0.5 + seg(f, 50, 80, 'whip') * Math.PI * 2 + Math.max(0, f - 80) * (0.32 / 30);
    const rx = 0.3 * seg(f, 50, 64, 'softInOut') - 0.18 * seg(f, 64, 82, 'softLand');
    objects.burger = { rotation: [rx, ry, 0] };
    return { camera: framing(f), objects };
  },
});

/* embers: seeded, linear drift (BRASA's hero motif) */
(function embers() {
  let s = 41;
  const rnd = () => ((s = (s * 16807) % 2147483647) / 2147483647);
  const box = document.getElementById('embers');
  for (let i = 0; i < 18; i++) {
    const el = document.createElement('i');
    const size = 3 + rnd() * 4;
    Object.assign(el.style, { width: size + 'px', height: size + 'px', left: Math.round(rnd() * 1080) + 'px', top: '0px', opacity: (0.35 + rnd() * 0.5).toFixed(2) });
    box.appendChild(el);
    const y0 = 600 + rnd() * 1500, rise = 700 + rnd() * 900, sway = (rnd() - 0.5) * 80;
    M.kf(el, 'y', [[0, y0], [CUT_CTA, y0 - rise]]);
    M.kf(el, 'x', [[0, 0], [CUT_CTA, sway]], { ease: 'softInOut' });
  }
})();

/* BEAT 1  HOOK: words at a fast speech rhythm, then they leave while the burger is already turning */
M.words('#hook1', { at: 3, mech: 'rise', gaps: [4], dist: 90, frames: 12, smear: true });
M.words('#hook2', { at: 14, mech: 'rise', gaps: [3, 4], dist: 90, frames: 12, smear: true });
M.exit('#hook', { at: 54, frames: 10, ease: 'accelExit', to: { y: -140, blur: 6 }, smear: true, hide: true });

/* BEAT 2  the code that draws each layer: typed, and the layer answers */
TYPE_AT.forEach((at, i) => {
  const until = i < 5 ? TYPE_AT[i + 1] - 1 : COLLAPSE[0];   // the next caret parks 1 f early, so this line leaves first
  M.show('#c' + i, at, until);
  M.type('#c' + i, { at, style: 'fast', seed: 3 + i, caret: '#k' + i, caretOff: until, accentNewest: { color: ACCENT_DARK, frames: 2 } });
});
M.mark(LIFT_AT[0], 'show', 'first layer lifts');

/* BEAT 3  into the site */
// The phone is scaled about the burger slot so its burger always matches the 3D burger's size (scale = 27.1 / camera distance).
M.show('#phoneRig', PHONE_IN[0], CUT_CTA);
const phoneScale = [];
for (let f = PHONE_IN[0]; f <= CUT_CTA; f++) phoneScale.push([f, 27.1 / Math.hypot(...framing(f).position.map((v, i) => v - framing(f).target[i]))]);
M.kf('#phoneRig', 'scale', phoneScale);
M.words('#site', { at: 200, mech: 'rise', gaps: [4, 5], dist: 80, frames: 12, smear: true });
// the thumb parks on "Pedir agora", presses, and the film cuts at the deepest point
const BTN0 = { x: 240 + 12 + 359 + 94, y: 470 + 12 + 92 + 29 };
const BTN = { x: SLOT.x + (BTN0.x - SLOT.x) * pushAt(260), y: SLOT.y + (BTN0.y - SLOT.y) * pushAt(260) };   // where the push has taken it
M.kf('#touchPos', 'x', [[0, BTN.x + 60], [248, BTN.x + 60], [259, BTN.x, 'softLand'], [CUT_CTA, BTN.x + 3]]);
M.kf('#touchPos', 'y', [[0, BTN.y + 260], [248, BTN.y + 260], [259, BTN.y - 26, 'softLand'], [CUT_CTA, BTN.y - 29]]);
M.kf('#touchPos', 'scale', [[263, 1], [266, 0.82, 'gentleIn']]);
M.enter('#touch', { at: 248, frames: 10, ease: 'softLand', from: { scale: 2.2, opacity: 0 } });
M.kf('#btn', 'scale', [[264, 1], [267, 0.9, 'gentleIn']]);
M.mark(267, 'press', 'Pedir agora');

/* BEAT 4  CTA: BRASA's world becomes CODE SITE's */
M.cut(CUT_CTA, { hide: ['#world'], show: ['#cta'] });
M.words('#q1', { at: CUT_CTA, mech: 'rise', gaps: [3, 4], dist: 90, frames: 12, smear: true });
M.words('#q2', { at: CUT_CTA + 10, mech: 'rise', dist: 90, frames: 12, smear: true });
M.words('#q3', { at: CUT_CTA + 22, mech: 'rise', gaps: [4, 5], dist: 90, frames: 12, smear: true });
M.enter('#num', { at: CUT_CTA + 40, frames: 14, ease: 'snapSettle', from: { scale: 1.6, blur: 10 } });
M.enter('#mark', { at: CUT_CTA + 52, frames: 12, ease: 'softLand', from: { y: 60 }, smear: { axis: 'y', px: 24, frames: 3 } });
M.kf('#ctaCam', 'scale', [[CUT_CTA + 40, 1.03], [359, 0.96, 'gentleIn']]);

window.__ready = Motion.loaded().then(() => { if (/selftest/.test(location.search)) Motion.selfTest(M, { samples: 24 }); });
</script>
