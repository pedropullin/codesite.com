<style>
@font-face { font-family: Bricolage; font-weight: 800; src: url(../reel-hamburguer/assets/fonts/bricolage-grotesque-latin-800-normal.woff2) format("woff2"); }
@font-face { font-family: Bricolage; font-weight: 700; src: url(../reel-hamburguer/assets/fonts/bricolage-grotesque-latin-700-normal.woff2) format("woff2"); }
/* ACCENT = the order arriving (the store's moon gold), and blue = CODE SITE on the CTA only */
:root { --ink: #0b0b0c; --cream: #f4f1ea; --accent: #2b46ff; --moon: #f3d48a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
#main { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; background: #070a14; font-family: Bricolage, sans-serif; }
.scene { position: absolute; inset: 0; }
/* night: a blue room with a window glow; morning fades in over it */
#night { background:
  radial-gradient(ellipse 60% 34% at 18% 22%, rgba(140, 165, 255, .22), transparent 70%),
  radial-gradient(ellipse 80% 40% at 50% 62%, rgba(80, 100, 190, .16), transparent 75%),
  linear-gradient(180deg, #0b1020 0%, #090c18 60%, #06070d 100%); }
#morning { position: absolute; inset: 0; opacity: 0; background:
  radial-gradient(ellipse 70% 40% at 16% 20%, rgba(255, 214, 150, .55), transparent 70%),
  radial-gradient(ellipse 80% 45% at 50% 60%, rgba(255, 170, 90, .22), transparent 75%),
  linear-gradient(180deg, #3a2a1c 0%, #241a12 60%, #120d09 100%); }
#gl { position: absolute; inset: 0; width: 1080px; height: 1920px; z-index: 2; }
.say { position: absolute; left: 0; width: 1080px; text-align: center; color: var(--cream); font-weight: 800; letter-spacing: -0.035em; white-space: pre; z-index: 3; }
#clock { top: 196px; font-size: 220px; line-height: 220px; letter-spacing: -0.05em; }
#closed { top: 430px; font-size: 92px; line-height: 100px; }
#notclosed { top: 250px; font-size: 112px; line-height: 120px; }
#wake1, #wake2 { font-size: 112px; line-height: 120px; }
#wake1 { top: 230px; }
#wake2 { top: 350px; }

/* the phone: a magnified lock screen, the notifications sit under the clock */
#phoneShot { position: absolute; inset: 0; z-index: 4; overflow: hidden; background: #070a14; }
#cam { position: absolute; inset: 0; }
#ui { position: absolute; left: 0; top: -150px; --s: 2.75; }
#ui .nu-screen { box-shadow: none; }
#ui .nu-lock-stack { bottom: auto; top: calc(252 * var(--u)); }

#cta { background:
  radial-gradient(ellipse 90% 50% at 50% 18%, #fffdf8, rgba(255, 253, 248, 0) 70%),
  radial-gradient(ellipse 100% 80% at 50% 50%, transparent 60%, rgba(60, 50, 30, .12)),
  #efebe2; color: var(--ink); }
#ctaCam { position: absolute; inset: 0; }
#cta .say { color: var(--ink); font-size: 116px; line-height: 122px; }
#q1 { top: 452px; }
#q2 { top: 574px; }

#num { position: absolute; left: 0; width: 1080px; top: 940px; display: flex; justify-content: center; }
#num span { display: inline-flex; align-items: center; gap: 26px; padding: 26px 50px 26px 34px; border-radius: 999px; background: #fff; box-shadow: 0 40px 80px -40px rgba(30, 25, 10, .45); font-weight: 800; font-size: 84px; letter-spacing: -0.03em; }
#num svg { width: 84px; height: 84px; fill: #25d366; }
#mark { position: absolute; left: 0; width: 1080px; top: 1208px; display: flex; justify-content: center; align-items: center; gap: 20px; font-weight: 700; font-size: 46px; letter-spacing: -0.01em; }
#mark svg { width: 66px; height: 66px; }
</style>

<body>
<div id="main">

    <div id="night" class="scene"></div>
    <div id="morning"></div>
    <canvas id="gl" width="1080" height="1920"></canvas>
    <div id="clock" class="say">03:14.</div>
    <div id="closed" class="say">Sua loja fechou.</div>
    <div id="notclosed" class="say">O site não.</div>
    <div id="wake1" class="say">Você acorda</div>
    <div id="wake2" class="say">com pedido.</div>
    <div id="phoneShot"><div id="cam"><div id="ui" class="nu"></div></div></div>
  </section>

  <section id="cta" class="scene">

      <div id="q1" class="say">Seu site vende</div>
      <div id="q2" class="say">enquanto você</div>
      <div id="q3" class="say">dorme.</div>
      <div id="num"><span><svg viewBox="0 0 24 24"><path d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.64.07-.3-.15-1.25-.46-2.39-1.47-.88-.79-1.48-1.76-1.65-2.06-.17-.3-.02-.46.13-.6.13-.14.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.03-.52-.07-.15-.67-1.61-.92-2.2-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.8.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.88 1.21 3.08c.15.2 2.1 3.2 5.08 4.49.71.31 1.26.49 1.7.63.71.22 1.36.19 1.87.12.57-.09 1.76-.72 2-1.41.25-.7.25-1.29.18-1.41-.07-.13-.27-.2-.57-.35M12.05 21.4h-.01a9.87 9.87 0 0 1-5.03-1.38l-.36-.21-3.74.98 1-3.65-.24-.37a9.86 9.86 0 0 1-1.51-5.26c0-5.45 4.44-9.88 9.9-9.88 2.64 0 5.12 1.03 6.99 2.9a9.82 9.82 0 0 1 2.89 6.99c0 5.45-4.44 9.88-9.89 9.88m8.41-18.3A11.81 11.81 0 0 0 12.05 0C5.5 0 .16 5.34.16 11.9c0 2.1.55 4.14 1.59 5.95L.06 24l6.3-1.65a11.88 11.88 0 0 0 5.68 1.45h.01c6.55 0 11.89-5.34 11.89-11.9 0-3.18-1.24-6.16-3.48-8.41"/></svg>(41) 98430-3059</span></div>
      <div id="mark"><svg viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#0b0b0c"/><path d="M12.5 10.5 7 16l5.5 5.5M19.5 10.5 25 16l-5.5 5.5" fill="none" stroke="#f5f3ee" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M17.6 9 14.4 23" stroke="#2b46ff" stroke-width="2.6" stroke-linecap="round"/></svg>CODE SITE</div>
    </div>
  </section>

</div>

<script src="../../.claude/skills/motionmaxxing/runtime/vendor/gsap.min.js"></script>
<script src="../../.claude/skills/motionmaxxing/runtime/motion.js"></script>
<script src="../../.claude/skills/motionmaxxing/runtime/native-ui/native-ui.js"></script>
<script>
/* SEEK CONTRACT: everything visible is a pure function of t. */
const M = Motion.film({ fps: 30, duration: 12, width: 1080, height: 1920, clock: 'smooth' });
const E = Motion.ease;
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const seg = (f, a, b, e = 'softLand') => E[e](clamp01((f - a) / (b - a)));
const lerp = (a, b, x) => a + (b - a) * x;
const RUNTIME = new URL('../../.claude/skills/motionmaxxing/runtime/', location.href).href;

/* Frame plan (STORYBOARD.md): the phone is the cause, the bag the effect, cut against each other */
const PHONE = [[54, 80], [104, 128], [150, 172]];     // phone shots
const ARRIVE = [56, 104, 150];                          // a notification rolls up in each
const DROP = [82, 130, 174];                            // ...and the next bag shot opens on its box falling in
const DAWN = [196, 244];                                // the light turns to morning
const CUT_CTA = 270;
const inPhone = (f) => PHONE.some(([a, b]) => f >= a && f < b);

/* the lock screen: a fictional store, "lua.", selling at night (illustrative orders) */
const moon = NativeUI.appIcon({ bg: 'linear-gradient(180deg,#1f2233,#0d0f18)', glyph: '<svg viewBox="0 0 38 38"><path d="M23.5 9.5a10 10 0 1 0 5 17.5A11 11 0 0 1 23.5 9.5z" fill="#f3d48a"/></svg>' });
const WALL = 'radial-gradient(90% 50% at 70% 18%, rgba(140,160,255,.35), rgba(140,160,255,0) 60%), radial-gradient(120% 70% at 20% 90%, #1a1f3d, rgba(26,31,61,0) 70%), linear-gradient(170deg,#0e1430,#05060c)';
document.getElementById('ui').innerHTML = NativeUI.phone(NativeUI.lockScreen({
  time: '3:14', wallpaper: WALL,
  notifs: [
    { icon: moon, title: 'lua. · Novo pedido #1042', time: '2 min', body: 'Vestido Linho Areia · R$ 189,90 · pago no Pix' },
    { icon: moon, title: 'lua. · Novo pedido #1043', time: '1 min', body: 'Bolsa de Palha Natural · R$ 129,00 · pago no Pix' },
    { icon: moon, title: 'lua. · Novo pedido #1044', time: 'agora', body: 'Sandália Couro Caramelo · R$ 219,90 · pago no cartão' },
  ] }), { time: '3:14', battery: 0.64 });

function bagTexture(THREE) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 640;
  const g = c.getContext('2d');
  g.fillStyle = '#c9a274'; g.fillRect(0, 0, 512, 640);
  let s = 7; const rnd = () => ((s = (s * 16807) % 2147483647) / 2147483647);
  for (let i = 0; i < 2600; i++) {                       // paper fibres
    g.strokeStyle = rnd() > 0.5 ? 'rgba(120,85,45,.18)' : 'rgba(240,215,175,.16)';
    g.lineWidth = 0.6 + rnd(); const x = rnd() * 512, y = rnd() * 640, a = rnd() * 6.28, l = 3 + rnd() * 9;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
  }
  g.fillStyle = 'rgba(70,45,20,.18)'; g.fillRect(0, 0, 512, 44);   // folded top band
  g.fillStyle = '#16141a'; g.font = '800 120px Bricolage, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('lua.', 256, 330);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}

function framing(f) {
  const push = seg(f, 0, DAWN[0], 'cruise');
  const orbit = 0.32 * seg(f, DAWN[0] - 20, CUT_CTA, 'softInOut');
  const d = lerp(6.4, 5.6, push), ty = 0.85, e = 17, r = (e * Math.PI) / 180;
  return { position: [Math.sin(orbit - 0.12) * d * Math.cos(r), ty + d * Math.sin(r), Math.cos(orbit - 0.12) * d * Math.cos(r)], target: [0, ty, 0], fov: 30 };
}

M.hero3d('#gl', {
  width: 1080, height: 1920,
  envMap: 'room', toneMapping: 'aces', exposure: 1.0,
  key: { position: [-5, 4.5, 3], intensity: 1, color: '#9fb2ff' },
  rim: { position: [4, 3, -4], intensity: 2.2, color: '#6f86ff' },
  ground: { y: -0.01, opacity: 0 },                      // enables the shadow map; the counter catches the shadows
  camera: { fov: 30, position: [0, 2.7, 6.2], target: [0, 0.85, 0] },
  build: async (THREE, scene) => {
    await document.fonts.load('800 120px Bricolage');
    const W = 1.0, H = 1.2, D = 0.5;
    const tex = bagTexture(THREE);
    const paper = new THREE.MeshStandardMaterial({ color: '#c9a274', roughness: 0.85, side: THREE.DoubleSide });
    const front = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.8, side: THREE.DoubleSide });
    const bag = new THREE.Group();
    const wall = (w, h, mat, x, z, ry) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h, 1, 1), mat); m.position.set(x, h / 2, z); m.rotation.y = ry; m.castShadow = m.receiveShadow = true; bag.add(m); };
    wall(W, H, front, 0, D / 2, 0); wall(W, H, paper, 0, -D / 2, Math.PI); wall(D, H, paper, -W / 2, 0, -Math.PI / 2); wall(D, H, paper, W / 2, 0, Math.PI / 2);
    const bottom = new THREE.Mesh(new THREE.PlaneGeometry(W, D), paper); bottom.rotation.x = -Math.PI / 2; bottom.position.y = 0.002; bag.add(bottom);
    // rope handles
    const rope = new THREE.MeshStandardMaterial({ color: '#1c1a20', roughness: 0.7 });
    [D / 2 - 0.02, -D / 2 + 0.02].forEach((z) => {
      const curve = new THREE.CatmullRomCurve3([new THREE.Vector3(-0.22, H - 0.06, z), new THREE.Vector3(-0.2, H + 0.2, z), new THREE.Vector3(0, H + 0.34, z), new THREE.Vector3(0.2, H + 0.2, z), new THREE.Vector3(0.22, H - 0.06, z)]);
      const m = new THREE.Mesh(new THREE.TubeGeometry(curve, 40, 0.018, 10), rope); m.castShadow = true; bag.add(m);
    });
    // the three orders that fall in (each one sticks out a little more)
    const kraft = new THREE.MeshStandardMaterial({ color: '#b98a55', roughness: 0.7 });
    const tissue = new THREE.MeshStandardMaterial({ color: '#f1ece2', roughness: 0.95 });
    const shoe = new THREE.MeshStandardMaterial({ color: '#2a2630', roughness: 0.5 });
    const items = [
      new THREE.Mesh(new THREE.BoxGeometry(0.62, 1.3, 0.3), kraft),
      new THREE.Mesh(new THREE.SphereGeometry(0.26, 24, 16), tissue),
      new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.5, 0.26), shoe),
    ];
    items[1].scale.set(1.1, 0.8, 0.8);
    const rest = [[-0.14, 0.67, -0.03], [0.24, 1.2, 0.04], [0.08, 1.12, -0.05]];
    items.forEach((m, i) => { m.position.set(...rest[i]); m.castShadow = m.receiveShadow = true; });
    // the counter
    const counter = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.MeshStandardMaterial({ color: '#2a2622', roughness: 0.55, metalness: 0.1 }));
    counter.rotation.x = -Math.PI / 2; counter.receiveShadow = true;
    const hemi = new THREE.HemisphereLight('#8ea2ff', '#141018', 0.35);
    scene.add(counter, bag, hemi, ...items);
    return { bag, counter, hemi, item0: items[0], item1: items[1], item2: items[2] };
  },
  state: (t, o, ctx) => {
    const f = ctx.f;
    if (f >= CUT_CTA || inPhone(f)) return { objects: { bag: { visible: false }, counter: { visible: false }, item0: { visible: false }, item1: { visible: false }, item2: { visible: false } } };
    const objects = {};
    const rest = [[-0.14, 0.67, -0.03], [0.24, 1.2, 0.04], [0.08, 1.12, -0.05]];
    let squash = 1;
    DROP.forEach((d, i) => {
      const k = seg(f, d, d + 9, 'crashIn');
      const p = rest[i];
      objects['item' + i] = { position: [p[0], lerp(p[1] + 3.2, p[1], k), p[2]], rotation: [0, lerp(0.9, i * 0.4 - 0.3, k), lerp(0.4, i === 1 ? 0.2 : 0, k)], visible: f >= d };
      squash *= 1 - 0.035 * Math.exp(-Math.max(0, f - (d + 9)) / 2.5) * (f >= d + 9 ? 1 : 0);
    });
    objects.bag = { scale: [1 + (1 - squash) * 0.5, squash, 1 + (1 - squash) * 0.5] };
    // night to morning
    const dawn = seg(f, DAWN[0], DAWN[1], 'softInOut');
    ctx.keyLight.color.set('#9fb2ff').lerp(new ctx.THREE.Color('#ffcf94'), dawn);
    o.hemi.color.set('#8ea2ff').lerp(new ctx.THREE.Color('#ffe2bd'), dawn);
    o.hemi.intensity = lerp(0.35, 0.7, dawn);
    o.counter.material.color.set('#2a2622').lerp(new ctx.THREE.Color('#4a3a2c'), dawn);
    return {
      camera: framing(f), objects,
      keyIntensity: lerp(1.0, 3.4, dawn), rimIntensity: lerp(2.2, 1.2, dawn),
      keyPosition: [lerp(-5, -4, dawn), lerp(4.5, 3.2, dawn), 3], envIntensity: lerp(0.25, 0.7, dawn),
    };
  },
});

/* the phone shots: cut in, a notification rolls up, slow creep; cut out to the bag */
const notif = (i) => `#ui .nu-notif:nth-child(${i + 1})`;
// opacity, not visibility: the notifications set their own visibility when they arrive, which would show through a hidden parent
M.kf('#phoneShot', 'opacity', [[0, 0], ...PHONE.flatMap(([a, b]) => [[a, 0], [a, 1], [b, 1], [b, 0]])]);
NativeUI.arrive(M, notif(0), { at: ARRIVE[0], dir: 'up', frames: 8 });
NativeUI.arrive(M, notif(1), { at: ARRIVE[1], dir: 'up', frames: 8 });
NativeUI.arrive(M, notif(2), { at: ARRIVE[2], dir: 'up', frames: 8 });
M.drift('#cam', { prop: 'scale', from: 1, to: 1.06, start: PHONE[0][0], end: PHONE[2][1] });

/* type on the bag shots only */
M.words('#clock', { at: 2, mech: 'shrink', frames: 14 });
M.words('#closed', { at: 16, mech: 'rise', gaps: [4, 4], dist: 80, frames: 12, smear: true });
M.hide('#clock', PHONE[0][0]); M.hide('#closed', PHONE[0][0]);
M.show('#notclosed', 84, PHONE[1][0]);
M.words('#notclosed', { at: 86, mech: 'rise', gaps: [4, 4], dist: 80, frames: 12, smear: true });
M.kf('#morning', 'opacity', [[DAWN[0], 0], [DAWN[1], 1, 'softInOut']]);
M.words('#wake1', { at: 214, mech: 'rise', gaps: [4], dist: 90, frames: 12, smear: true });
M.words('#wake2', { at: 224, mech: 'rise', gaps: [4], dist: 90, frames: 12, smear: true });
DROP.forEach((d, i) => M.mark(d, 'show', 'order ' + (i + 1) + ' falls in'));

/* CTA */
M.cut(CUT_CTA, { hide: ['#world'], show: ['#cta'] });
M.words('#q1', { at: CUT_CTA, mech: 'rise', gaps: [3, 4], dist: 90, frames: 12, smear: true });
M.words('#q2', { at: CUT_CTA + 9, mech: 'rise', gaps: [4], dist: 90, frames: 12, smear: true });
M.words('#q3', { at: CUT_CTA + 18, mech: 'rise', dist: 90, frames: 12, smear: true });
M.enter('#num', { at: CUT_CTA + 32, frames: 14, ease: 'snapSettle', from: { scale: 1.6, blur: 10 } });
M.enter('#mark', { at: CUT_CTA + 44, frames: 12, ease: 'softLand', from: { y: 60 }, smear: { axis: 'y', px: 24, frames: 3 } });
M.kf('#ctaCam', 'scale', [[CUT_CTA + 32, 1.04], [359, 0.9, 'cruise']]);

window.__ready = Motion.loaded().then(() => { if (/selftest/.test(location.search)) Motion.selfTest(M, { samples: 24 }); });
</script>
