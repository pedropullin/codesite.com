<script>
/* SEEK CONTRACT: everything visible is a pure function of t. */
const M = Motion.film({ fps: 30, duration: 12, width: 1080, height: 1920, clock: 'smooth' });
const E = Motion.ease;
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const seg = (f, a, b, e = 'softLand') => E[e](clamp01((f - a) / (b - a)));
const lerp = (a, b, x) => a + (b - a) * x;
const RUNTIME = new URL('../../.claude/skills/motionmaxxing/runtime/', location.href).href;

/* Frame plan (STORYBOARD.md) */
const FLY = [0, 112];          // down the corridor of identical templates
const PULSE = [120, 150];      // they all light up the same way
const RISE = [150, 168];       // one leaves the grid
const SPIN = 158;              // ...and spins
const MATCH = 172;             // match cut on the spin: the template is now the burger
const CUT_CTA = 270;
const SW = 0.56, SH = 1.0, SD = 0.05, DX = 0.8, DZ = 1.4;   // a template slab and the grid pitch

function templateTexture(THREE) {
  const c = document.createElement('canvas'); c.width = 280; c.height = 500;
  const g = c.getContext('2d');
  g.fillStyle = '#d6d6d8'; g.fillRect(0, 0, 280, 500);
  g.fillStyle = '#bfc0c4'; g.fillRect(0, 0, 280, 34);
  ['#a7a8ad', '#a7a8ad', '#a7a8ad'].forEach((col, i) => { g.fillStyle = col; g.beginPath(); g.arc(20 + i * 18, 17, 6, 0, 7); g.fill(); });
  g.fillStyle = '#c4c5c9'; g.fillRect(20, 56, 240, 150);
  g.fillStyle = '#a3a4a9'; g.fillRect(20, 230, 190, 22);
  g.fillStyle = '#b5b6bb'; [266, 290, 314].forEach((y, i) => g.fillRect(20, y, 240 - i * 40, 12));
  g.fillStyle = '#9c9da2'; g.beginPath(); g.roundRect(20, 352, 120, 40, 20); g.fill();
  g.fillStyle = '#c4c5c9'; g.fillRect(20, 420, 112, 62); g.fillRect(148, 420, 112, 62);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}

function framing(f) {
  // fly: from far back and high, decelerating to stand in front of the centre slab
  const fly = seg(f, FLY[0], FLY[1], 'glide');
  let cz = lerp(15.5, 3.4, fly), cy = lerp(2.4, 1.05, fly), tz = cz - lerp(7, 3.4, fly), ty = lerp(0.7, 0.6, fly);
  // after the match cut: pull back and up to frame the burger above the dimmed grid
  const out = seg(f, RISE[0], MATCH + 26, 'softInOut');   // pulls back while the template rises, so its spin is in frame
  cz = lerp(cz, 5.4, out); cy = lerp(cy, 2.5, out); tz = lerp(tz, 0, out); ty = lerp(ty, 1.45, out);
  const orbit = 0.18 * seg(f, MATCH + 30, CUT_CTA, 'cruise');
  const r = Math.hypot(cz, 0);
  return { position: [Math.sin(orbit) * r, cy, Math.cos(orbit) * r], target: [0, ty, tz * (1 - out)], fov: 30 };
}

M.hero3d('#gl', {
  width: 1080, height: 1920,
  envMap: 'room', toneMapping: 'aces', exposure: 0.95, envIntensity: 0.5,
  key: { position: [3, 7, 5], intensity: 2.2, color: '#e9ecf5' },
  rim: { position: [-4, 2.5, -3.5], intensity: 2.2, color: '#b8bfd6' },
  ground: { y: 0, opacity: 0.35 },
  camera: { fov: 30, position: [0, 2.4, 15.5], target: [0, 0.7, 8.5] },
  build: async (THREE, scene) => {
    const { RoundedBoxGeometry } = await import(RUNTIME + 'hero3d/vendor/addons/geometries/RoundedBoxGeometry.js');
    const tex = templateTexture(THREE);
    const side = new THREE.MeshStandardMaterial({ color: '#b9babf', roughness: 0.6 });
    const face = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.55, emissive: '#ffffff', emissiveIntensity: 0, emissiveMap: tex });
    const geo = new THREE.BoxGeometry(SW, SH, SD);
    const mats = [side, side, side, side, face, side];
    // the grid of identical templates, with a corridor down x = 0 in front of the hero
    const spots = [];
    for (let ix = -7; ix <= 7; ix++) for (let iz = -9; iz <= 12; iz++) {
      if (ix === 0 && iz >= 0) continue;
      spots.push([ix * DX, SH / 2, -iz * DZ + 0]);
    }
    const grid = new THREE.InstancedMesh(geo, mats, spots.length);
    const m4 = new THREE.Matrix4();
    spots.forEach(([x, y, z], i) => { m4.makeTranslation(x, y, -z); grid.setMatrixAt(i, m4); });
    grid.castShadow = grid.receiveShadow = true;
    // the one that leaves (same look as the rest until it moves)
    const hero = new THREE.Mesh(geo, mats);
    hero.position.set(0, SH / 2, 0);
    // the burger it turns into (match cut)
    const b = BurgerKit(THREE).makeBurger();
    b.root.scale.setScalar(0.5);
    b.root.position.set(0, 1.1, 0);
    const hemi = new THREE.HemisphereLight('#ffd9a8', '#1a120c', 0);
    scene.add(hemi, grid, hero, b.root);
    return { grid, hero, burger: b.root, hemi };
  },
  state: (t, o, ctx) => {
    const f = ctx.f;
    if (f >= CUT_CTA) return { objects: { grid: { visible: false }, hero: { visible: false }, burger: { visible: false } } };
    // every template lights up the same way at the same time
    const pulse = Math.exp(-(((f - 132) / 7) ** 2)) * 0.55;
    const dim = seg(f, MATCH, MATCH + 24, 'softInOut');
    o.grid.material[4].emissiveIntensity = pulse * (1 - dim);
    o.grid.material[4].color.setScalar(lerp(1, 0.18, dim));
    o.grid.material[0].color.set('#b9babf').multiplyScalar(lerp(1, 0.18, dim));
    // the hero slab rises and whips; at the match cut the burger carries the spin
    const rise = seg(f, RISE[0], RISE[1], 'softLand');
    const spin = (x) => x * x * 2.2;                    // accelerating turn (radians) for the template
    const heroRot = f >= SPIN ? spin((f - SPIN) / 6) : 0;
    const burgerRot = f >= MATCH ? spin((MATCH - SPIN) / 6) + (1 - Math.exp(-(f - MATCH) / 9)) * 9 : 0;
    ctx.keyLight.color.set(f >= MATCH ? '#ffe2b8' : '#e9ecf5');
    if (ctx.rimLight) ctx.rimLight.color.set(f >= MATCH ? '#ff5a1f' : '#b8bfd6');
    o.hemi.intensity = f >= MATCH ? 0.45 : 0;
    return {
      camera: framing(f),
      objects: {
        hero: { position: [0, lerp(SH / 2, 1.25, rise), 0], rotation: [0, heroRot, 0], visible: f < MATCH },
        burger: { position: [0, 1.1, 0], rotation: [0, burgerRot, 0], scale: 0.5, visible: f >= MATCH },
      },
      keyIntensity: f >= MATCH ? 2.6 : 2.2,
      rimIntensity: f >= MATCH ? 3.2 : 2.2,
    };
  },
});

/* type: three short statements, each leaves while the picture is moving */
M.words('#a1', { at: 4, mech: 'rise', gaps: [4, 4, 4], dist: 90, frames: 12, smear: true });
M.words('#a2', { at: 18, mech: 'rise', gaps: [4], dist: 90, frames: 12, smear: true });
M.exit('#aBox', { at: 70, frames: 10, ease: 'accelExit', to: { y: -140, blur: 6 }, smear: true, hide: true });
M.words('#b1', { at: 86, mech: 'rise', gaps: [4], dist: 90, frames: 12, smear: true });
M.words('#b2', { at: 96, mech: 'rise', gaps: [4, 4], dist: 90, frames: 12, smear: true });
M.exit('#bBox', { at: 150, frames: 10, ease: 'accelExit', to: { y: -140, blur: 6 }, smear: true, hide: true });
M.kf('#warm', 'opacity', [[MATCH - 1, 0], [MATCH, 0.55], [MATCH + 24, 1, 'softInOut']]);
M.kf('#fog', 'opacity', [[RISE[0], 1], [RISE[1] - 2, 0, 'softInOut']]);   // the fog lifts as the template leaves the grid
M.mark(MATCH, 'cut', 'template -> burger (match on the spin)');
M.words('#c1', { at: 190, mech: 'rise', gaps: [4], dist: 90, frames: 12, smear: true });
M.words('#c2', { at: 200, mech: 'rise', gaps: [4, 4, 4], dist: 90, frames: 12, smear: true });

/* CTA */
M.cut(CUT_CTA, { hide: ['#world'], show: ['#cta'] });
M.words('#q1', { at: CUT_CTA, mech: 'rise', gaps: [3, 4], dist: 90, frames: 12, smear: true });
M.words('#q2', { at: CUT_CTA + 10, mech: 'rise', gaps: [4], dist: 90, frames: 12, smear: true });
M.enter('#num', { at: CUT_CTA + 30, frames: 14, ease: 'snapSettle', from: { scale: 1.6, blur: 10 } });
M.enter('#mark', { at: CUT_CTA + 42, frames: 12, ease: 'softLand', from: { y: 60 }, smear: { axis: 'y', px: 24, frames: 3 } });
M.kf('#ctaCam', 'scale', [[CUT_CTA + 30, 1.04], [359, 0.9, 'cruise']]);   // never resolves: the lockup keeps shrinking to the last frame

window.__ready = Motion.loaded().then(() => { if (/selftest/.test(location.search)) Motion.selfTest(M, { samples: 24 }); });
</script>
